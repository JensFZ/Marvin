name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Die als 'ffmpeg' markierten Tests kodieren echtes Material.
      - name: ffmpeg bereitstellen
        run: |
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            Write-Host "ffmpeg ist bereits vorhanden"
          } else {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Abhaengigkeiten installieren
        run: python -m pip install --upgrade pip pytest send2trash

      - name: Tests
        run: python -m pytest -v
